# Landownload + a Tailscale Funnel sidecar that gives this PC a permanent public HTTPS address.
# Start/stop with the "Start Landownload" / "Stop Landownload" shortcuts (docker/landownload.ps1).
name: landownload

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: landownload
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
      # One-time auth key from .env; after the first login the saved state is reused.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./docker/serve.json:/config/serve.json:ro
    ports:
      # The app shares this container's network, so local access goes through here too.
      - "127.0.0.1:8000:8000"

  app:
    build: .
    network_mode: service:tailscale
    depends_on:
      - tailscale
    # Values come from .env next to this file; the image itself never contains .env.
    environment:
      LANDOWNLOAD_ORIGINS: ${LANDOWNLOAD_ORIGINS:-https://elmariones.github.io}
      LANDOWNLOAD_WORKERS: ${LANDOWNLOAD_WORKERS:-2}
      LANDOWNLOAD_RETENTION_HOURS: ${LANDOWNLOAD_RETENTION_HOURS:-48}
      LANDOWNLOAD_TOKEN: ${LANDOWNLOAD_TOKEN:-}
    volumes:
      - downloads:/data

volumes:
  tailscale-state:
  downloads:
